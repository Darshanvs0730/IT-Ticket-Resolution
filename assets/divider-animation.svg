<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="20">
    <style>
        .line { stroke: #007acc; stroke-width: 4; stroke-dasharray: 20, 20; animation: move 2s linear infinite; }
        @keyframes move {
            to { stroke-dashoffset: -40; }
        }
    </style>
    <line x1="0" y1="10" x2="1000" y2="10" class="line" />
</svg>
