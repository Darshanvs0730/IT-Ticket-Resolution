<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150">
    <style>
        .title { font: bold 56px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #007acc; }
        .subtitle { font: 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #666; animation: fade 2s infinite alternate; }
        @keyframes fade {
            from { opacity: 0.3; }
            to { opacity: 1; }
        }
        .pulse { fill: #28a745; animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite; }
        @keyframes ping {
            75%, 100% { transform: scale(1.8); opacity: 0; }
        }
    </style>
    <rect width="100%" height="100%" fill="#f8f9fa" rx="15" />
    <circle cx="70" cy="75" r="12" fill="#28a745" />
    <circle cx="70" cy="75" r="12" class="pulse" />
    <text x="110" y="85" class="title">ClinicaLake</text>
    <text x="110" y="125" class="subtitle">Next-Gen Medallion Clinical Data Engine</text>
</svg>
