<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200">
    <style>
        .box { fill: #ffffff; stroke: #333333; stroke-width: 3; rx: 12; }
        .box-raw { stroke: #555555; }
        .box-bronze { stroke: #cd7f32; fill: #fff6eb; }
        .box-silver { stroke: #c0c0c0; fill: #f8f9fa; }
        .box-gold { stroke: #ffd700; fill: #fffdf0; }
        .text { font: bold 18px -apple-system, sans-serif; fill: #333; text-anchor: middle; }
        .subtext { font: 12px -apple-system, sans-serif; fill: #666; text-anchor: middle; }
        .arrow { stroke: #007acc; stroke-width: 4; fill: none; stroke-dasharray: 5, 5; animation: flow 1s linear infinite; }
        @keyframes flow {
            to { stroke-dashoffset: -10; }
        }
        .data { fill: #28a745; animation: slide 4s infinite; }
        @keyframes slide {
            0% { transform: translateX(0px); opacity: 1; fill: #555; }
            33% { transform: translateX(250px); opacity: 1; fill: #cd7f32; }
            66% { transform: translateX(500px); opacity: 1; fill: #c0c0c0; }
            100% { transform: translateX(750px); opacity: 0; fill: #ffd700; }
        }
    </style>
    
    <!-- Boxes -->
    <rect x="50" y="50" width="160" height="100" class="box box-raw" />
    <text x="130" y="100" class="text">RAW TICKET</text>
    <text x="130" y="125" class="subtext">User Input</text>
    
    <path d="M 210 100 L 300 100" class="arrow" />
    
    <rect x="300" y="50" width="160" height="100" class="box box-bronze" />
    <text x="380" y="100" class="text">VECTORIZE</text>
    <text x="380" y="125" class="subtext">TF-IDF Extraction</text>
    
    <path d="M 460 100 L 550 100" class="arrow" />
    
    <rect x="550" y="50" width="160" height="100" class="box box-silver" />
    <text x="630" y="100" class="text">MATCH</text>
    <text x="630" y="125" class="subtext">Cosine Similarity</text>
    
    <path d="M 710 100 L 800 100" class="arrow" />
    
    <rect x="800" y="50" width="160" height="100" class="box box-gold" />
    <text x="880" y="100" class="text">RESOLVE</text>
    <text x="880" y="125" class="subtext">Groq LLaMA 3.1</text>
    
    <!-- Animated Data Packet -->
    <circle cx="210" cy="100" r="8" class="data" />
</svg>
